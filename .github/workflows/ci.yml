# Generated by tools/ci/pipeline.js — do not hand edit.
# Regenerate with `npm run ci:generate`; verify with `npm run ci:check`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  ci-drift:
    name: Workflow drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check the generated workflow
        run: npm run ci:check

  vendor:
    name: Vendor integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check vendored dependencies
        run: npm run vendor:check

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  test-node:
    name: Node tests
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Node suites
        run: npm run test:node

  test-browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install the headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser suites
        run: npm run test:browser

  test-jsc:
    name: JavaScriptCore tests
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install the JavaScriptCore shell
        run: sudo apt-get update && sudo apt-get install --yes libjavascriptcoregtk-bin
      - name: Verify the JavaScriptCore shell
        run: test -x /usr/bin/jsc
      - name: Run JavaScriptCore suites
        run: npm run test:jsc

  test262-fixtures:
    name: Test262 fixtures
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run the local fixture suite
        run: npm run test262:fixtures

  test262-es2015-release:
    name: Pinned Test262 ES2015 focused suites
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Check out the pinned Test262 tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'tc39/test262'
          ref: 'b363f29d3c43c626dc852744ad64a0b48a003693'
          path: 'vendor/test262'
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run focused ES2015 Test262 suites
        run: npm run test262:es2015-release
        env:
          TZ: 'UTC'

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run benchmark correctness smoke
        run: npm run benchmark:smoke

  test262-upstream:
    name: Pinned Test262 subset
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Check out the pinned Test262 tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'tc39/test262'
          ref: 'b363f29d3c43c626dc852744ad64a0b48a003693'
          path: 'vendor/test262'
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check unknown-edition provenance
        run: npm run test262:es2015:provenance:check
        env:
          TZ: 'UTC'
      - name: Check the ES2015 taxonomy and exact promotion
        run: npm run test262:es2015:audit:check
        env:
          TZ: 'UTC'
      - name: Check the ES5 selection is current
        run: npm run test262:select:check
      - name: Remove the committed Test262 report
        run: rm -f docs/test262-report.jsonl
      - name: Run the pinned Test262 subset
        run: npm run test262:upstream
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          TZ: 'UTC'
      - name: Check for stale exclusions
        run: npm run test262:exclusions:check
      - name: Check the generated report is current
        run: git ls-files --error-unmatch docs/test262-report.jsonl docs/conformance.md > /dev/null && git diff --exit-code -- docs/test262-report.jsonl docs/conformance.md
      - name: Publish the Test262 report
        if: always() && hashFiles('docs/test262-report.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'test262-upstream-report'
          path: 'docs/test262-report.jsonl'
          if-no-files-found: 'error'
