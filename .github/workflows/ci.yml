# Generated by tools/ci/pipeline.js — do not hand edit.
# Regenerate with `npm run ci:generate`; verify with `npm run ci:check`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  ci-drift:
    name: ${{ github.event_name != 'pull_request_target' && 'Workflow drift' || 'Workflow drift (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check the generated workflow
        run: npm run ci:check

  vendor:
    name: ${{ github.event_name != 'pull_request_target' && 'Vendor integrity' || 'Vendor integrity (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check vendored dependencies
        run: npm run vendor:check

  format:
    name: ${{ github.event_name != 'pull_request_target' && 'Formatting' || 'Formatting (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format

  lint:
    name: ${{ github.event_name != 'pull_request_target' && 'Lint' || 'Lint (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: ${{ github.event_name != 'pull_request_target' && 'Type check' || 'Type check (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  test-node:
    name: ${{ github.event_name != 'pull_request_target' && 'Node tests' || 'Node tests (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Node suites
        run: npm run test:node

  test-browser:
    name: ${{ github.event_name != 'pull_request_target' && 'Browser tests' || 'Browser tests (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install the headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser suites
        run: npm run test:browser

  test-jsc:
    name: ${{ github.event_name != 'pull_request_target' && 'JavaScriptCore tests' || 'JavaScriptCore tests (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install the JavaScriptCore shell
        run: sudo apt-get update && sudo apt-get install --yes libjavascriptcoregtk-bin
      - name: Verify the JavaScriptCore shell
        run: test -x /usr/bin/jsc
      - name: Run JavaScriptCore suites
        run: npm run test:jsc

  test262-fixtures:
    name: ${{ github.event_name != 'pull_request_target' && 'Test262 fixtures' || 'Test262 fixtures (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run the local fixture suite
        run: npm run test262:fixtures

  test262-es2015-release:
    name: ${{ github.event_name != 'pull_request_target' && 'Pinned Test262 ES2015 focused suites' || 'Pinned Test262 ES2015 focused suites (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Check out the pinned Test262 tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'tc39/test262'
          ref: 'b363f29d3c43c626dc852744ad64a0b48a003693'
          path: 'vendor/test262'
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run focused ES2015 Test262 suites
        run: npm run test262:es2015-release
        env:
          TZ: 'UTC'

  benchmark-smoke:
    name: ${{ github.event_name != 'pull_request_target' && 'Benchmark smoke' || 'Benchmark smoke (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run benchmark correctness smoke
        run: npm run benchmark:smoke

  test262-upstream:
    name: ${{ github.event_name != 'pull_request_target' && 'Pinned Test262 subset' || 'Pinned Test262 subset (inactive on pull_request_target)' }}
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    needs: [vendor]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: '0'
      - name: Check out the pinned Test262 tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'tc39/test262'
          ref: 'b363f29d3c43c626dc852744ad64a0b48a003693'
          path: 'vendor/test262'
          persist-credentials: 'false'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check provenance PR range
        if: github.event_name == 'pull_request'
        run: node tools/test262/es2015-provenance-check.js --check-range --base="$ES2015_PROVENANCE_BASE_SHA" --head="$ES2015_PROVENANCE_HEAD_SHA" --pr-body-env=ES2015_PROVENANCE_PR_BODY
        env:
          ES2015_PROVENANCE_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          ES2015_PROVENANCE_HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          ES2015_PROVENANCE_PR_BODY: '${{ github.event.pull_request.body }}'
          TZ: 'UTC'
      - name: Check unknown-edition provenance
        run: npm run test262:es2015:provenance:check
        env:
          TZ: 'UTC'
      - name: Check the ES2015 taxonomy and exact promotion
        run: npm run test262:es2015:audit:check
        env:
          TZ: 'UTC'
      - name: Check the ES5 selection is current
        run: npm run test262:select:check
      - name: Remove the committed Test262 report
        run: rm -f docs/test262-report.jsonl
      - name: Run the pinned Test262 subset
        run: npm run test262:upstream
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          TZ: 'UTC'
      - name: Check for stale exclusions
        run: npm run test262:exclusions:check
      - name: Check the generated report is current
        run: git ls-files --error-unmatch docs/test262-report.jsonl docs/conformance.md > /dev/null && git diff --exit-code -- docs/test262-report.jsonl docs/conformance.md
      - name: Publish the Test262 report
        if: always() && hashFiles('docs/test262-report.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'test262-upstream-report'
          path: 'docs/test262-report.jsonl'
          if-no-files-found: 'error'

  provenance-base-guard:
    name: ${{ github.event_name == 'pull_request_target' && 'Provenance base guard' || 'Provenance base guard (inactive)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: provenance-base-guard-${{ github.event_name }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Validate the canonical guard target
        if: github.event_name == 'pull_request_target'
        run: printf '%s' "$BASE_REPOSITORY" | grep -Eq '^yoonbuck/jsjs$' && printf '%s' "$WORKFLOW_REPOSITORY" | grep -Eq '^yoonbuck/jsjs$' && printf '%s' "$BASE_REF" | grep -Eq '^main$' && printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' && printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$' && printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
        env:
          BASE_REPOSITORY: '${{ github.event.pull_request.base.repo.full_name }}'
          WORKFLOW_REPOSITORY: '${{ github.repository }}'
          BASE_REF: '${{ github.event.pull_request.base.ref }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
      - name: Check out the event base commit
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.base.sha }}'
          fetch-depth: '0'
          persist-credentials: 'false'
          submodules: 'false'
      - name: Attest the checked-out base commit
        if: github.event_name == 'pull_request_target'
        run: test "$(git rev-parse --verify 'HEAD^{commit}')" = "$BASE_SHA"
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
      - name: Set up Node
        if: github.event_name == 'pull_request_target'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Fetch the current target branch
        if: github.event_name == 'pull_request_target'
        run: git fetch --no-tags --no-recurse-submodules origin +refs/heads/main:refs/remotes/origin/provenance-target-main
      - name: Attest the live target branch
        if: github.event_name == 'pull_request_target'
        run: test "$(git rev-parse --verify 'refs/remotes/origin/provenance-target-main^{commit}')" = "$BASE_SHA" && test "$(git rev-parse --verify 'HEAD^{commit}')" = "$BASE_SHA"
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
      - name: Fetch the advertised pull request ref
        if: github.event_name == 'pull_request_target'
        run: git fetch --no-tags --no-recurse-submodules origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
      - name: Attest the fetched head commit
        if: github.event_name == 'pull_request_target'
        run: test "$(git rev-parse --verify "refs/remotes/pull/${PR_NUMBER}/head^{commit}")" = "$HEAD_SHA" && test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$HEAD_SHA"
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
      - name: Check the trusted-base provenance range
        if: github.event_name == 'pull_request_target'
        run: node tools/test262/es2015-provenance-check.js --check-range --base="$BASE_SHA" --head="$HEAD_SHA" --pr-body-env=PR_BODY
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_BODY: '${{ github.event.pull_request.body }}'
          TZ: 'UTC'
      - name: Keep the inactive guard context distinct
        if: github.event_name != 'pull_request_target'
        run: test "$GITHUB_EVENT_NAME" != pull_request_target
